# Resonance stack for Coolify ("Docker Compose" build pack, this repo as source).
#
# Set these in Coolify → Environment Variables:
#   POSTGRES_PASSWORD        random string
#   MUSIC_PATH               host path of the music library on the HDD, e.g. /mnt/hdd/music
#   DOWNLOADS_PATH           host path for incoming downloads (same disk as MUSIC_PATH), e.g. /mnt/hdd/downloads
#   BOOKS_PATH               host path for ebooks (library + import drop folder), e.g. /mnt/hdd/books
#   IMPORT_PATH              drop folder: music copied here is identified, tagged and moved into the library, e.g. /mnt/hdd/import
#   APPDATA_PATH             host path on the SSD for DB + caches, e.g. /mnt/ssd/resonance
#   WIREGUARD_PRIVATE_KEY    from the ProtonVPN WireGuard config (enable "NAT-PMP / port forwarding" when creating it)
#   WIREGUARD_ADDRESSES      "Address" line of that config (default 10.2.0.2/32)
#   PROTON_SERVER_COUNTRIES  e.g. Netherlands,Switzerland
#   PROWLARR_NETWORK         Docker network of an existing Prowlarr, e.g. the media stack's Coolify network
#   PROWLARR_URL             e.g. http://prowlarr-<id>:9696
#   PUID / PGID             owner of the music files on the host (default 1000:1000); APPDATA_PATH/app must be writable by it
#   APP_PORT / QBIT_PORT     host ports bound to 127.0.0.1 (for a reverse proxy / Cloudflare tunnel on the host),
#                            default 8765 (Resonance) and 8095 (qBittorrent web UI)
#
# Torrents are off by default; enable them in Admin → Server and enter the Prowlarr API key and the
# qBittorrent credentials there. qBittorrent only ever talks through the VPN (gluetun kill switch).

# Volumes use the long bind syntax: Coolify turns short "${VAR}:/path" entries into named volumes.
services:
  resonance:
    build:
      context: .
      # Build steps use the host's resolver (bridge containers on some hosts cannot reach the LAN DNS).
      network: host
    restart: unless-stopped
    # Files in the library belong to the host user (same as qBittorrent's PUID/PGID).
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      HOME: /data/app/home
      RESONANCE_DATABASE_URL: postgresql+asyncpg://resonance:${POSTGRES_PASSWORD}@postgres:5432/resonance
      RESONANCE_QBITTORRENT_URL: http://gluetun:8080
      RESONANCE_PROWLARR_URL: ${PROWLARR_URL:-http://prowlarr:9696}
    volumes:
      - type: bind
        source: ${MUSIC_PATH}
        target: /data/music
      - type: bind
        source: ${DOWNLOADS_PATH}
        target: /data/downloads
      - type: bind
        source: ${BOOKS_PATH}
        target: /data/books
      - type: bind
        source: ${IMPORT_PATH}
        target: /data/import
      - type: bind
        source: ${APPDATA_PATH}/app
        target: /data/app
    ports:
      - "127.0.0.1:${APP_PORT:-8765}:8000"
    networks:
      - default
      - prowlarr
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: resonance
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: resonance
    volumes:
      - type: bind
        source: ${APPDATA_PATH}/postgres
        target: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resonance"]
      interval: 10s
      timeout: 5s
      retries: 5

  # All download traffic goes through the VPN. If the tunnel drops, gluetun's
  # firewall blocks everything (kill switch) - qBittorrent never leaks.
  gluetun:
    image: qmcgaw/gluetun:latest
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      VPN_SERVICE_PROVIDER: protonvpn
      VPN_TYPE: wireguard
      WIREGUARD_PRIVATE_KEY: ${WIREGUARD_PRIVATE_KEY}
      WIREGUARD_ADDRESSES: ${WIREGUARD_ADDRESSES:-10.2.0.2/32}
      SERVER_COUNTRIES: ${PROTON_SERVER_COUNTRIES:-Netherlands}
      VPN_PORT_FORWARDING: "on"
      PORT_FORWARD_ONLY: "on"
      # Push the forwarded port into qBittorrent (needs "Bypass authentication for clients on localhost" in qBittorrent).
      VPN_PORT_FORWARDING_UP_COMMAND: >-
        /bin/sh -c 'wget -O- --retry-connrefused --post-data
        "json={\"listen_port\":{{PORTS}},\"current_network_interface\":\"{{VPN_INTERFACE}}\"}"
        http://127.0.0.1:8080/api/v2/app/setPreferences 2>&1'
      TZ: Europe/Berlin
    volumes:
      - type: bind
        source: ${APPDATA_PATH}/gluetun
        target: /gluetun
    ports:
      - "127.0.0.1:${QBIT_PORT:-8095}:8080"   # qBittorrent web UI

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    restart: unless-stopped
    network_mode: "service:gluetun"
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: Europe/Berlin
      WEBUI_PORT: "8080"
    volumes:
      - type: bind
        source: ${APPDATA_PATH}/qbittorrent
        target: /config
      - type: bind
        source: ${DOWNLOADS_PATH}
        target: /data/downloads
    # Started, not healthy: when ProtonVPN is slow to connect the deploy must not fail and leave qBittorrent stopped.
    # Until the tunnel is up gluetun's firewall blocks all traffic, so qBittorrent still never leaks.
    depends_on:
      gluetun:
        condition: service_started

networks:
  prowlarr:
    external: true
    name: ${PROWLARR_NETWORK}
