# Builds the Linux and Windows apps when a GitHub release is published and attaches them to it.
# The Android APK is built and attached locally by scripts/release-android.sh (the signing key stays local).
name: Desktop release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the builds to (e.g. v1.0.7)
        required: true

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.47.7
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libmpv-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build
        working-directory: app
        run: flutter build linux --release
      - name: Package and upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="Resonance-${TAG}-linux-x64.tar.gz"
          tar -C app/build/linux/x64/release/bundle -czf "$name" .
          gh release upload "$TAG" "$name" --clobber

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build
        working-directory: app
        run: flutter build windows --release
      - name: Package and upload
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $name = "Resonance-$env:TAG-windows-x64.zip"
          Compress-Archive -Path app/build/windows/x64/runner/Release/* -DestinationPath $name
          gh release upload $env:TAG $name --clobber
