# Builds the Linux and Windows apps when a GitHub release is published and attaches them to it.
# The Android APK is built and attached locally by scripts/release-android.sh (the signing key stays local).
name: Desktop release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the builds to (e.g. v1.0.7); for a dry run any branch
        required: true
      dry_run:
        description: Only build and keep the files as workflow artifacts (no release upload)
        type: boolean
        default: false

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.47.7
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  linux:
    # Oldest supported base: the AppImage runs on distributions with this glibc or newer.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake ninja-build pkg-config libgtk-3-dev libmpv-dev file
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build
        working-directory: app
        run: flutter build linux --release
      - name: Package and upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="Resonance-${TAG}-linux-x86_64.AppImage"
          scripts/package-linux-appimage.sh app/build/linux/x64/release/bundle "$name"
          if [ "${{ inputs.dry_run }}" != "true" ]; then gh release upload "$TAG" "$name" --clobber; fi
      - if: inputs.dry_run
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: Resonance-*.AppImage

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build
        working-directory: app
        run: flutter build windows --release
      - name: Package and upload
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; if ($LASTEXITCODE) { exit 1 } }
          $version = $env:TAG.TrimStart("v")
          $release = (Resolve-Path app/build/windows/x64/runner/Release).Path
          & $iscc "/DAppVersion=$version" "/DSourceDir=$release" "/O$PWD" app/windows/installer/resonance.iss
          if ($LASTEXITCODE) { exit 1 }
          $setup = "Resonance-$env:TAG-windows-setup.exe"
          Move-Item Resonance-setup.exe $setup
          # Portable build for people who do not want to install.
          $zip = "Resonance-$env:TAG-windows-x64-portable.zip"
          Compress-Archive -Path "$release\*" -DestinationPath $zip
          if ("${{ inputs.dry_run }}" -ne "true") { gh release upload $env:TAG $setup $zip --clobber }
      - if: inputs.dry_run
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: Resonance-*-windows-*
